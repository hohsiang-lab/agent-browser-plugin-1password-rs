name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [staging-monster-amd64-ci, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sh -n scripts/install-macos-arm64.sh
      - run: python3 -m py_compile scripts/diagnose-credential-provider.py
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Build macOS Apple Silicon binary
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
      - name: Upload macOS Apple Silicon binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: agent-browser-plugin-1password-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/agent-browser-plugin-1password
          if-no-files-found: error
          retention-days: 7
